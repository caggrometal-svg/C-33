name: C-33 AI Resilience Battery

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: c33-ai-resilience-battery-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ai-resilience-battery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install runtime
        run: python -m pip install -r requirements.txt

      - name: Run AI resilience battery 1-5
        run: python tests/test_ai_resilience_battery.py
