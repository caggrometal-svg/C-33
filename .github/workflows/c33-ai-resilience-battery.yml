name: C-33 AI Resilience Battery

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: c33-ai-resilience-battery-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ai-resilience-battery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install runtime
        run: python -m pip install -r requirements.txt

      - name: Run AI resilience battery 1-5
        run: python tests/test_ai_resilience_battery.py


      - name: Run extended AI resilience checks 6-9
        run: python tests/test_ai_extended_resilience.py

      - name: Production idempotency x2
        env:
          BASE: https://iac33-backup-production.up.railway.app
        run: |
          set -euo pipefail
          request_id="c33-idempotency-\${GITHUB_RUN_ID}"
          conversation_id="c33-idempotency-\${GITHUB_RUN_ID}"
          payload="\$(python - "\$request_id" "\$conversation_id" <<'PY'
          import json, sys
          print(json.dumps({
              "message": "Reply exactly C33_IDEMPOTENCY_OK",
              "user_id": "ci-idempotency",
              "conversation_id": sys.argv[2],
              "request_id": sys.argv[1],
              "stream": False,
              "personality": "base",
              "voice_tone": "neutral",
          }))
          PY
          )"

          first="\$(curl --silent --show-error --fail-with-body --max-time 35 \
            -H "Content-Type: application/json" \
            -H "X-C33-Deadline-Epoch-Ms: \$(( \$(date +%s%3N) + 30000 ))" \
            -d "\$payload" "\$BASE/v1/chat")"

          second="\$(curl --silent --show-error --fail-with-body --max-time 35 \
            -H "Content-Type: application/json" \
            -H "X-C33-Deadline-Epoch-Ms: \$(( \$(date +%s%3N) + 30000 ))" \
            -d "\$payload" "\$BASE/v1/chat")"

          python - "\$first" "\$second" <<'PY'
          import json, sys
          a, b = map(json.loads, sys.argv[1:3])
          assert a.get("status") == "ok", a
          assert b.get("status") == "ok", b
          assert a.get("request_id") == b.get("request_id"), (a, b)
          assert a.get("synthesis") == b.get("synthesis"), (a, b)
          assert (a.get("_meta") or {}).get("used_local_fallback") is False, a
          assert (b.get("_meta") or {}).get("used_local_fallback") is False, b
          print({
              "status":"PASS",
              "test":"7_production_idempotency",
              "same_request_id":True,
              "same_synthesis":True,
              "second_reused_durable_result":True,
          })
          PY
