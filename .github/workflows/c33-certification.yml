name: C-33 Certification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: c33-certification-main
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  backend:
    name: Backend unit/resilience
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q src tests
      - run: python -m unittest discover -s tests -p "test_*.py" -v

  mobile:
    name: Mobile web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - working-directory: mobile
        run: npm install --no-audit --no-fund
      - working-directory: mobile
        run: npm run build


  android:
    name: Android packaging/lint gate
    needs: [mobile]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - working-directory: mobile
        run: npm install --no-audit --no-fund
      - working-directory: mobile
        run: npm run build
      - working-directory: mobile
        run: npx cap add android
      - working-directory: mobile
        run: npx cap sync android
      - working-directory: mobile/android
        run: ./gradlew lint

      - name: Set NEXO 0.1.6 version
        working-directory: mobile/android
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path("app/build.gradle")
          s = p.read_text()
          s = re.sub(r"versionCode\s+\d+", "versionCode 6", s, count=1)
          s = re.sub(r'versionName\s+"[^"]+"', 'versionName "0.1.6"', s, count=1)
          p.write_text(s)
          PY

      - name: Assemble NEXO 0.1.6 APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug

      - name: Verify NEXO 0.1.6 APK
        run: |
          test -f mobile/android/app/build/outputs/apk/debug/app-debug.apk
          echo "NEXO 0.1.6 APK ready:"
          ls -lh mobile/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload NEXO 0.1.6 APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXO-0.1.6-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14


  release_install:
    name: Release APK checksum / emulator install
    needs: [mobile]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - working-directory: mobile
        run: npm install --no-audit --no-fund
      - working-directory: mobile
        run: npm run build
      - working-directory: mobile
        run: npx cap add android
      - working-directory: mobile
        run: npx cap sync android
      - name: Pin release version
        working-directory: mobile/android
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path("app/build.gradle")
          s = p.read_text()
          s = re.sub(r"versionCode\s+\d+", "versionCode 6", s, count=1)
          s = re.sub(r'versionName\s+"[^"]+"', 'versionName "0.1.6"', s, count=1)
          p.write_text(s)
          PY
      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Sign and verify release APK
        working-directory: mobile/android
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore c33-release-ci.jks \
            -alias c33-ci \
            -keyalg RSA -keysize 2048 \
            -validity 3650 \
            -storepass changeit -keypass changeit \
            -dname "CN=C-33 CI,O=C-33,C=CL"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" sign \
            --ks c33-release-ci.jks \
            --ks-key-alias c33-ci \
            --ks-pass pass:changeit \
            --key-pass pass:changeit \
            --out app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk
      - name: SHA-256 signed release APK
        run: |
          test -f mobile/android/app/build/outputs/apk/release/app-release.apk
          sha256sum mobile/android/app/build/outputs/apk/release/app-release.apk | tee SHA256SUMS.txt
      - name: Install release APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          cores: 4
          ram-size: 4096M
          emulator-options: "-no-window -noaudio -no-boot-anim -gpu swiftshader_indirect"
          script: |
            set -euo pipefail
            echo "C33_EMULATOR_BOOTED: PASS"
            package_ready=false
            for i in $(seq 1 45); do
              if adb shell cmd package list packages >/dev/null 2>&1; then
                package_ready=true
                echo "C33_PACKAGE_MANAGER_READY: PASS"
                break
              fi
              sleep 2
            done
            if [ "$package_ready" != "true" ]; then
              adb shell service check package || true
              adb shell getprop sys.boot_completed || true
              exit 1
            fi
            install_ok=false
            for i in $(seq 1 30); do
              if adb shell service check package >/dev/null 2>&1 && adb shell cmd package list packages >/dev/null 2>&1; then
                echo "C33_PACKAGE_SERVICE_READY: PASS"
                install_ok=true
                break
              fi
              sleep 2
            done
            if [ "$install_ok" != "true" ]; then
              adb shell service check package || true
              adb shell getprop sys.boot_completed || true
              adb shell dumpsys activity service SystemUIService || true
              exit 1
            fi
            timeout 180s adb install --no-incremental -r mobile/android/app/build/outputs/apk/release/app-release.apk
            adb shell pm path com.c33.mobile
            adb shell am force-stop com.c33.mobile
            adb shell monkey -p com.c33.mobile 1
            for i in $(seq 1 30); do
              if adb shell dumpsys activity activities | grep -q "com.c33.mobile"; then
                echo "C33_RELEASE_INSTALL_AND_LAUNCH: PASS"
                exit 0
              fi
              sleep 1
            done
            adb shell dumpsys activity activities
            exit 1
      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: C33-0.1.6-release-evidence
          path: |
            mobile/android/app/build/outputs/apk/release/app-release.apk
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  closure:
    name: NEXO closure 41-60
    needs: [backend]
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Verify closure matrix 41-60
        run: |
          python -m unittest tests.test_phases_41_60 -v
          python - <<'PY'
          import sys
          sys.path.insert(0, "src")
          from nexo.phases_41_60 import Closure41To60
          assert Closure41To60.validate()
          assert Closure41To60.green_sections() == tuple(range(41, 61))
          assert all(row["status"] != "RED" for row in Closure41To60.status_matrix())
          print("NEXO 41-60 CLOSURE GREEN")
          print("GREEN SECTIONS:", ",".join(map(str, Closure41To60.green_sections())))
          print("BLUE CAPABILITIES:", ",".join(Closure41To60.blue_capabilities()))
          PY

  closure_61_100:
    name: NEXO closure 61-100
    needs: [backend]
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Verify closure matrix 61-100
        run: |
          python -m unittest tests.test_phases_61_100 -v
          python - <<'PY'
          import sys
          sys.path.insert(0, "src")
          from nexo.phases_61_100 import Nexo61To100
          assert Nexo61To100.validate()
          assert Nexo61To100.contract_green_sections() == tuple(range(61, 101))
          assert Nexo61To100.runtime_green_sections() == ()
          assert Nexo61To100.runtime_blue_sections() == tuple(range(73, 101))
          assert Nexo61To100.not_applicable_runtime_sections() == tuple(range(61, 73))
          assert not Nexo61To100.has_red()
          print("NEXO 61-100 CONTRACT MATRIX GREEN")
          print("CONTRACT GREEN:", ",".join(map(str, Nexo61To100.contract_green_sections())))
          print("RUNTIME GREEN:", ",".join(map(str, Nexo61To100.runtime_green_sections())))
          print("RUNTIME BLUE:", ",".join(map(str, Nexo61To100.runtime_blue_sections())))
          print("RUNTIME N/A:", ",".join(map(str, Nexo61To100.not_applicable_runtime_sections())))
          print("BLUE CAPABILITIES:", ",".join(Nexo61To100.blue_capabilities()))
          PY


  six_runtime_surfaces:
    name: NEXO six capability runtime surfaces
    needs: [backend, mobile, release_install]
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Verify local LLM and action execution boundaries
        run: |
          python -m unittest tests.test_local_llm tests.test_actions tests.test_six_capabilities -v
          python - <<'PY'
          from pathlib import Path
          api = Path("src/api.py").read_text(encoding="utf-8")
          mobile = Path("mobile/app.js").read_text(encoding="utf-8")
          for endpoint in ("/v1/local-ai", "/v1/replication/status", "/v1/export", "/v1/import", "/v1/actions/execute"):
              assert endpoint in api, endpoint
          for marker in ("exportNexoData", "importNexoData", "/v1/export", "/v1/import"):
              assert marker in mobile, marker
          operational = "\n".join(
              Path(path).read_text(encoding="utf-8")
              for path in ("src/config.py", "src/core/config.py", "src/resilience/providers.py", ".env.example")
          ).lower()
          for forbidden in ("blockrun.ai", "openai.com"):
              assert forbidden not in operational, "paid provider remains: " + forbidden
          assert "kilo-auto/free" in operational
          assert "vireonix.ai" in operational
          config_text = Path("src/config.py").read_text(encoding="utf-8")
          assert "AI_ZERO_COST_MODE" in config_text
          assert "paid_inference_keys_are_disabled_in_free_mode" in config_text
          print("NEXO SIX RUNTIME SURFACES GREEN")
          print("NEXO FREE-ONLY POLICY GREEN")
          PY

  live:
    name: Railway live connectivity
    needs: [backend, mobile, release_install]
    runs-on: ubuntu-latest
    env:
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install httpx cryptography
      - name: Live certification
        run: |
          python - <<'PY'
          import json, os, time, uuid
          import httpx

          def post_json(path, payload, *, timeout=22, attempts=8, retry_window=90, auth_headers=None):
              transient_statuses = {429, 500, 502, 503, 504}
              retry_deadline = time.time() + retry_window
              last_response = None
              last_error = None

              def server_retry_delay(response):
                  try:
                      data = response.json()
                      detail = data.get("detail", {})
                      if not isinstance(detail, dict):
                          return 0.0
                      delays = []
                      retry_after_ms = detail.get("retry_after_ms")
                      if retry_after_ms is not None:
                          delays.append(float(retry_after_ms) / 1000.0)
                      for attempt_data in detail.get("attempts", []):
                          if isinstance(attempt_data, dict) and attempt_data.get("cooldown_ms") is not None:
                              delays.append(float(attempt_data["cooldown_ms"]) / 1000.0)
                      return max(delays, default=0.0)
                  except (ValueError, TypeError, KeyError):
                      return 0.0

              for attempt in range(1, attempts + 1):
                  if time.time() >= retry_deadline:
                      break
                  try:
                      response = httpx.post(
                          base + path,
                          json=payload,
                          headers={
                              "X-C33-Allow-Local-Fallback": "false",
                              "X-C33-Deadline-Epoch-Ms": str(int((time.time() + 20) * 1000)),
                              **(auth_headers or {}),
                          },
                          timeout=timeout,
                      )
                      last_response = response
                      if response.status_code not in transient_statuses:
                          return response
                  except httpx.RequestError as exc:
                      last_error = exc

                  if attempt >= attempts:
                      break
                  exponential_delay = min(8.0, 2 ** (attempt - 1))
                  server_delay = server_retry_delay(last_response) if last_response is not None else 0.0
                  delay = max(1.0, exponential_delay, server_delay + 0.5)
                  delay = min(delay, max(0.0, retry_deadline - time.time()))
                  if delay <= 0:
                      break
                  time.sleep(delay)

              if last_response is not None:
                  return last_response
              raise SystemExit(f"remote request failed after {attempts} attempts/{retry_window}s: {last_error}")

          endpoints = json.loads(open("infra/c33-endpoints.json", encoding="utf-8").read())
          base = str(endpoints.get("production", "")).strip().rstrip("/")
          peer_base = str(endpoints.get("peer", "")).strip().rstrip("/")
          expected = os.environ["EXPECTED_SHA"]
          if not base or not peer_base:
              raise SystemExit("C33 live endpoint manifest is incomplete")
          deadline = time.time() + 900
          health_data = None
          runtime_sha = None

          while time.time() < deadline:
              try:
                  r = httpx.get(base + "/health", timeout=8, headers={"Cache-Control":"no-cache"})
                  if r.status_code == 200:
                      data = r.json()
                      candidate = str(data.get("deployment_sha", "")).strip()
                      if data.get("service") == "C-33" and candidate and candidate != "unknown":
                          health_data = data
                          runtime_sha = candidate
                          break
              except Exception:
                  pass
              time.sleep(5)

          if not health_data:
              raise SystemExit("Railway did not expose a live C-33 runtime SHA within 900s")
          print("RUNTIME_SHA:", runtime_sha)
          print("WORKFLOW_SHA:", expected)
          if runtime_sha != expected:
              print("RUNTIME_SHA_MISMATCH: runtime is observable and will be validated by functional live gates")

          ready_deadline = time.time() + 180
          ready = None
          last_ready = None
          while time.time() < ready_deadline:
              try:
                  response = httpx.get(base + "/ready", timeout=10, headers={"Cache-Control":"no-cache"})
                  last_ready = response
                  if response.status_code == 200:
                      ready = response
                      break
              except httpx.RequestError:
                  pass
              time.sleep(2)

          if ready is None:
              if last_ready is not None:
                  raise SystemExit(f"/ready failed after startup convergence window: {last_ready.status_code} {last_ready.text}")
              raise SystemExit("/ready failed: no response after startup convergence window")

          from cryptography.hazmat.primitives import hashes
          from cryptography.hazmat.primitives.asymmetric import ec
          from cryptography.hazmat.primitives.asymmetric.utils import decode_dss_signature

          def b64url(data):
              return __import__("base64").urlsafe_b64encode(data).rstrip(b"=").decode("ascii")

          auth_key = ec.generate_private_key(ec.SECP256R1())
          public_numbers = auth_key.public_key().public_numbers()
          public_jwk = {
              "kty": "EC",
              "crv": "P-256",
              "x": b64url(public_numbers.x.to_bytes(32, "big")),
              "y": b64url(public_numbers.y.to_bytes(32, "big")),
          }
          auth_challenge = httpx.post(base + "/v1/auth/challenge", timeout=8)
          if auth_challenge.status_code != 200:
              raise SystemExit(f"auth challenge failed: {auth_challenge.status_code} {auth_challenge.text}")
          challenge = auth_challenge.json().get("challenge", "")
          if not challenge:
              raise SystemExit("auth challenge missing")
          der = auth_key.sign(challenge.encode("utf-8"), ec.ECDSA(hashes.SHA256()))
          r_sig, s_sig = decode_dss_signature(der)
          raw_sig = r_sig.to_bytes(32, "big") + s_sig.to_bytes(32, "big")
          auth_session = httpx.post(
              base + "/v1/auth/session",
              json={
                  "challenge": challenge,
                  "device_id": "github-certification",
                  "public_key": public_jwk,
                  "signature": b64url(raw_sig),
              },
              timeout=10,
          )
          if auth_session.status_code != 200:
              raise SystemExit(f"auth session failed: {auth_session.status_code} {auth_session.text}")
          auth_token = str(auth_session.json().get("session_token", "")).strip()
          auth_identity = str(auth_session.json().get("identity_id", "")).strip()
          if not auth_token or not auth_identity:
              raise SystemExit("auth session returned incomplete identity")
          auth_headers = {"Authorization": "Bearer " + auth_token}
          print("AUTH_IDENTITY:", auth_identity)

          payload = {
              "message": "Reply with exactly C33_REMOTE_SMOKE_OK.",
              "user_id": auth_identity,
              "conversation_id": "cert-" + uuid.uuid4().hex,
              "request_id": uuid.uuid4().hex,
              "stream": False,
          }
          chat = post_json("/v1/chat", payload, auth_headers=auth_headers)
          if chat.status_code != 200:
              raise SystemExit(f"remote chat failed: {chat.status_code} {chat.text}")
          chat_data = chat.json()
          meta = chat_data.get("_meta", {})
          if meta.get("used_local_fallback"):
              raise SystemExit("remote chat unexpectedly used local fallback")
          if not str(chat_data.get("synthesis", "")).strip():
              raise SystemExit("remote chat returned empty synthesis")

          web_payload = {
              "message": "Usa Internet: consulta una fuente externa sobre Artemis II y responde mencionando la URL de una fuente consultada.",
              "user_id": auth_identity,
              "conversation_id": "web-cert-" + uuid.uuid4().hex,
              "request_id": uuid.uuid4().hex,
              "stream": False,
          }
          web_chat = post_json("/v1/chat", web_payload, auth_headers=auth_headers)
          if web_chat.status_code != 200:
              raise SystemExit(f"web-enabled chat failed: {web_chat.status_code} {web_chat.text}")
          web_data = web_chat.json()
          web_meta = web_data.get("_meta", {})
          web_sources = web_data.get("web_searches", [])
          if web_meta.get("used_local_fallback"):
              raise SystemExit("web-enabled chat unexpectedly used local fallback")
          if not str(web_data.get("synthesis", "")).strip():
              raise SystemExit("web-enabled chat returned empty synthesis")
          if not isinstance(web_sources, list) or not any(str(source).startswith(("http://", "https://")) for source in web_sources):
              raise SystemExit(f"web navigation produced no external sources: {json.dumps(web_data)}")
          
          ai = httpx.get(base + "/v1/ai-ready", timeout=8)
          if ai.status_code != 200:
              raise SystemExit(f"/v1/ai-ready after remote generation failed: {ai.status_code} {ai.text}")
          probe = ai.json()
          if probe.get("status") != "ai_ready" or not str(probe.get("provider_used", "")).strip():
              raise SystemExit(f"Invalid live AI readiness probe: {json.dumps(probe)}")

          second_payload = {
              "message": "Using the conversation context, reply briefly with C33_MEMORY_OK.",
              "user_id": auth_identity,
              "conversation_id": payload["conversation_id"],
              "request_id": uuid.uuid4().hex,
              "stream": False,
          }
          second = post_json("/v1/chat", second_payload, auth_headers=auth_headers)
          if second.status_code != 200:
              raise SystemExit(f"second remote chat failed: {second.status_code} {second.text}")
          second_data = second.json()
          second_meta = second_data.get("_meta", {})

          export_request = {
              "user_id": payload["user_id"],
              "conversation_id": payload["conversation_id"],
              "identity_id": payload["user_id"],
              "device_id": "github-export-device",
              "preferences": {"font_size": "medium", "voice_tone": "neutral"},
              "configuration": {"backend_urls": [base]},
          }
          exported = httpx.post(base + "/v1/export", json=export_request, headers=auth_headers, timeout=12)
          if exported.status_code != 200:
              raise SystemExit(f"export failed: {exported.status_code} {exported.text}")
          export_data = exported.json()
          bundle = export_data.get("bundle", {})
          if not bundle.get("sha256") or bundle.get("user_id") != payload["user_id"]:
              raise SystemExit(f"invalid export bundle: {json.dumps(export_data)}")

          imported_user = auth_identity
          imported_conversation = "import-" + uuid.uuid4().hex
          conversation_map = {}
          migrated_messages = []
          for message in bundle.get("messages", []):
              copy = dict(message)
              source_conversation = str(copy.get("conversation_id") or "default")
              target_conversation = conversation_map.setdefault(
                  source_conversation,
                  imported_conversation + "-" + uuid.uuid5(uuid.NAMESPACE_URL, source_conversation).hex[:12],
              )
              copy["id"] = str(uuid.uuid4())
              copy["user_id"] = imported_user
              copy["conversation_id"] = target_conversation
              migrated_messages.append(copy)
          migrated_bundle = dict(bundle)
          migrated_bundle["user_id"] = imported_user
          migrated_bundle["identity_id"] = imported_user
          migrated_bundle["device_id"] = "github-import-device"
          migrated_bundle["messages"] = migrated_messages
          payload_for_digest = dict(migrated_bundle)
          payload_for_digest.pop("sha256", None)
          raw_digest = json.dumps(
              payload_for_digest, ensure_ascii=False, sort_keys=True, separators=(",", ":")
          ).encode("utf-8")
          import hashlib
          migrated_bundle["sha256"] = hashlib.sha256(raw_digest).hexdigest()

          imported = httpx.post(base + "/v1/import", json={"bundle": migrated_bundle, "replicate": True}, headers=auth_headers, timeout=12)
          if imported.status_code != 200:
              raise SystemExit(f"import failed: {imported.status_code} {imported.text}")
          import_data = imported.json()
          if int(import_data.get("accepted", 0)) != len(migrated_messages):
              raise SystemExit(f"import did not accept full bundle: {json.dumps(import_data)}")

          local_ai = httpx.get(base + "/v1/local-ai", timeout=8)
          if local_ai.status_code != 200:
              raise SystemExit(f"local AI status surface failed: {local_ai.status_code} {local_ai.text}")
          local_ai_data = local_ai.json()
          if local_ai_data.get("provider") != "local" or not str(local_ai_data.get("model", "")).strip():
              raise SystemExit(f"invalid local AI status surface: {json.dumps(local_ai_data)}")
          if local_ai_data.get("status") not in {"ready", "disabled", "unavailable"}:
              raise SystemExit(f"invalid local AI status value: {json.dumps(local_ai_data)}")

          action_gate = httpx.post(
              base + "/v1/actions/execute",
              json={
                  "user_id": payload["user_id"],
                  "action": "certification.denied",
                  "url": "https://example.com",
                  "authorized": False,
              },
              timeout=8,
          )
          if action_gate.status_code != 401:
              raise SystemExit(f"action authorization gate failed: {action_gate.status_code} {action_gate.text}")

          if second_meta.get("used_local_fallback"):
              raise SystemExit("second remote chat unexpectedly used local fallback")
          if not str(second_data.get("synthesis", "")).strip():
              raise SystemExit("second remote chat returned empty synthesis")

          saw_token = False
          saw_done = False
          saw_fallback = False
          with httpx.stream(
              "POST",
              base + "/v1/ai/stream",
              json={
                  "message": "Reply briefly with C33_SSE_OK.",
                  "user_id": auth_identity,
                  "conversation_id": "sse-" + uuid.uuid4().hex,
                  "request_id": uuid.uuid4().hex,
                  "stream": True,
              },
              headers={
                  "Accept": "text/event-stream",
                  "X-C33-Allow-Local-Fallback": "false",
                  **auth_headers,
                  "X-C33-Deadline-Epoch-Ms": str(int((time.time() + 20) * 1000)),
              },
              timeout=22,
          ) as stream:
              if stream.status_code != 200:
                  raise SystemExit(f"SSE failed: {stream.status_code} {stream.read().decode(errors='replace')}")
              for line in stream.iter_lines():
                  if line.startswith("event: token"):
                      saw_token = True
                  elif line.startswith("event: done"):
                      saw_done = True
                  elif line.startswith("event: fallback"):
                      saw_fallback = True

          if not saw_token or not saw_done:
              raise SystemExit(f"SSE incomplete: token={saw_token} done={saw_done}")
          if saw_fallback:
              raise SystemExit("SSE used local fallback")

          status = httpx.get(base + "/status", timeout=8)
          if status.status_code != 200:
              raise SystemExit(f"/status failed: {status.status_code} {status.text}")

          base_host = httpx.URL(base).host
          peer_host = httpx.URL(peer_base).host
          if not base_host or not peer_host or base_host == peer_host:
              raise SystemExit(f"invalid replication topology: production={base_host!r} peer={peer_host!r}")
          peer_health = httpx.get(peer_base + "/health", timeout=8)
          if peer_health.status_code != 200:
              raise SystemExit(f"peer health failed: {peer_health.status_code} {peer_health.text}")
          peer_health_data = peer_health.json()
          if peer_health_data.get("status") != "alive" or peer_health_data.get("role") != "secondary":
              raise SystemExit(f"peer is not a live secondary: {json.dumps(peer_health_data)}")

          replication_deadline = time.time() + 300
          replication_data = {}
          while time.time() < replication_deadline:
              replication = httpx.get(base + "/v1/replication/status", timeout=8)
              if replication.status_code != 200:
                  raise SystemExit(f"/v1/replication/status failed: {replication.status_code} {replication.text}")
              replication_data = replication.json()
              if int(replication_data.get("replication_pending", -1)) == 0:
                  break
              time.sleep(3)
          if int(replication_data.get("replication_pending", -1)) != 0:
              raise SystemExit(f"replication is not quiesced: {json.dumps(replication_data)}")
          if replication_data.get("peer_status") != "ONLINE":
              raise SystemExit(f"real replication peer is not online: {json.dumps(replication_data)}")
          if replication_data.get("peer_host") != peer_host:
              raise SystemExit(
                  f"primary reports unexpected peer host: {replication_data.get('peer_host')!r} != {peer_host!r}"
              )
          if replication_data.get("quiesced") is not True:
              raise SystemExit(f"replication quiescence proof failed: {json.dumps(replication_data)}")
          peer_replication = httpx.get(peer_base + "/v1/replication/status", timeout=8)
          if peer_replication.status_code != 200:
              raise SystemExit(f"peer replication status failed: {peer_replication.status_code} {peer_replication.text}")
          peer_data = peer_replication.json()
          for key in ("total_messages", "unique_message_ids", "message_id_digest"):
              if peer_data.get(key) != replication_data.get(key):
                  raise SystemExit(
                      f"replication integrity mismatch for {key}: "
                      f"primary={replication_data.get(key)!r} peer={peer_data.get(key)!r}"
                  )
          if peer_data.get("backend_role") != "secondary":
              raise SystemExit(f"peer role mismatch: {json.dumps(peer_data)}")
          if int(peer_data.get("replication_pending", -1)) != 0:
              raise SystemExit(f"peer has pending replication work: {json.dumps(peer_data)}")

          diagnostics = httpx.get(base + "/v1/ai/diagnostics", timeout=8)
          if diagnostics.status_code != 200:
              raise SystemExit(f"/v1/ai/diagnostics failed: {diagnostics.status_code} {diagnostics.text}")
          diagnostics_data = diagnostics.json()
          if diagnostics_data.get("status") != "ok":
              raise SystemExit(f"invalid diagnostics status: {json.dumps(diagnostics_data)}")
          if int(diagnostics_data.get("providers_configured", 0)) < 2:
              raise SystemExit(f"provider redundancy missing: {json.dumps(diagnostics_data)}")
          if int(diagnostics_data.get("providers_ordered", 0)) != int(diagnostics_data.get("providers_configured", 0)):
              raise SystemExit(f"provider order incomplete: {json.dumps(diagnostics_data)}")
          if int(diagnostics_data.get("providers_selectable", 0)) < 2:
              raise SystemExit(f"provider selection incomplete: {json.dumps(diagnostics_data)}")
          if diagnostics_data.get("provider_configuration_valid") is not True:
              raise SystemExit(f"provider configuration invalid: {json.dumps(diagnostics_data)}")
          if diagnostics_data.get("local_fallback_enabled") is not True:
              raise SystemExit(f"local fallback must be enabled in production: {json.dumps(diagnostics_data)}")
          if len(set(diagnostics_data.get("provider_failure_domains", []))) < 2:
              raise SystemExit(f"provider failure domains not diverse: {json.dumps(diagnostics_data)}")

          print(json.dumps({
              "sha": expected,
              "health": health_data,
              "ready": ready.json(),
              "ai_ready": probe,
              "diagnostics": diagnostics_data,
              "chat_provider": meta.get("provider_used"),
              "second_chat_provider": second_meta.get("provider_used"),
              "chat_reason": meta.get("final_reason"),
              "sse": {"token": saw_token, "done": saw_done},
          }, ensure_ascii=False, indent=2))
          PY


  sse_replay_recovery:
    name: Android resilience SSE replay / Railway / Deplexo
    needs: [backend, mobile, release_install]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install httpx cryptography
      - name: Verify interrupted SSE recovery chain
        run: |
          python - <<'PY'
          import base64
          import json
          import time
          import uuid
          import httpx
          from cryptography.hazmat.primitives import hashes
          from cryptography.hazmat.primitives.asymmetric import ec
          from cryptography.hazmat.primitives.asymmetric.utils import decode_dss_signature

          endpoints = json.load(open("infra/c33-endpoints.json", encoding="utf-8"))
          railway = str(endpoints["production"]).rstrip("/")
          deplexo = str(endpoints["runtime_backup"]).rstrip("/")

          def b64url(data):
              return base64.urlsafe_b64encode(data).rstrip(b"=").decode("ascii")

          def make_identity():
              key = ec.generate_private_key(ec.SECP256R1())
              nums = key.public_key().public_numbers()
              public = {
                  "kty": "EC",
                  "crv": "P-256",
                  "x": b64url(nums.x.to_bytes(32, "big")),
                  "y": b64url(nums.y.to_bytes(32, "big")),
              }
              return key, public

          def session(base, key, public):
              challenge = httpx.post(base + "/v1/auth/challenge", timeout=10)
              if challenge.status_code != 200:
                  raise SystemExit(f"auth challenge failed on {base}: {challenge.status_code} {challenge.text}")
              challenge_value = challenge.json().get("challenge", "")
              der = key.sign(challenge_value.encode("utf-8"), ec.ECDSA(hashes.SHA256()))
              r, s = decode_dss_signature(der)
              raw = r.to_bytes(32, "big") + s.to_bytes(32, "big")
              response = httpx.post(
                  base + "/v1/auth/session",
                  json={
                      "challenge": challenge_value,
                      "device_id": "github-sse-recovery",
                      "public_key": public,
                      "signature": b64url(raw),
                  },
                  timeout=10,
              )
              if response.status_code != 200:
                  raise SystemExit(f"auth session failed on {base}: {response.status_code} {response.text}")
              token = response.json().get("session_token", "")
              identity = response.json().get("identity_id", "")
              if not token or not identity:
                  raise SystemExit("incomplete authentication session")
              return {
                  "Authorization": "Bearer " + token,
                  "identity": identity,
              }

          identity_key, identity_public = make_identity()
          railway_auth = session(railway, identity_key, identity_public)
          request_id = "sse-recovery-" + uuid.uuid4().hex
          conversation_id = "sse-recovery-conv-" + uuid.uuid4().hex
          payload = {
              "message": "Reply briefly with C33_INTERRUPTED_SSE_OK.",
              "user_id": railway_auth["identity"],
              "conversation_id": conversation_id,
              "request_id": request_id,
              "stream": True,
          }

          saw_token = False
          with httpx.stream(
              "POST",
              railway + "/v1/ai/stream",
              json=payload,
              headers={
                  **railway_auth,
                  "Accept": "text/event-stream",
                  "X-C33-Allow-Local-Fallback": "false",
                  "X-C33-Deadline-Epoch-Ms": str(int((time.time() + 20) * 1000)),
              },
              timeout=22,
          ) as response:
              if response.status_code != 200:
                  raise SystemExit(f"initial Railway SSE failed: {response.status_code} {response.read().decode(errors='replace')}")
              for line in response.iter_lines():
                  if line.startswith("event: token"):
                      saw_token = True
                  if saw_token:
                      break

          if not saw_token:
              raise SystemExit("SSE did not emit a token before interruption")
          print("INTERRUPTED_SSE: PASS", request_id)

          replay_deadline = time.time() + 8
          replay_status = None
          replay_data = None
          while time.time() < replay_deadline:
              response = httpx.post(
                  railway + "/v1/chat",
                  json={**payload, "stream": False},
                  headers={
                      **railway_auth,
                      "Content-Type": "application/json",
                      "X-C33-Replay-Only": "true",
                      "X-C33-Recovery": "sse-request-id",
                  },
                  timeout=10,
              )
              replay_status = response.status_code
              try:
                  replay_data = response.json()
              except ValueError:
                  replay_data = None
              if response.status_code == 200 and replay_data and replay_data.get("synthesis"):
                  if replay_data.get("request_id") != request_id:
                      raise SystemExit("Railway replay request_id mismatch")
                  if replay_data.get("_meta", {}).get("replayed") is not True:
                      raise SystemExit("Railway returned 200 without replayed=true")
                  print("RAILWAY_REPLAY: PASS", request_id)
                  break
              if response.status_code != 409:
                  raise SystemExit(f"unexpected Railway replay response: {response.status_code} {response.text}")
              time.sleep(1)
          else:
              print("RAILWAY_REPLAY: NOT_AVAILABLE_AFTER_INTERRUPTION")
              replay_data = None

          if replay_data:
              print("SSE_RECOVERY: Railway request_id replay completed")
              print(json.dumps({"request_id": request_id, "recovery_backend": "Railway", "replayed": True}))
              raise SystemExit(0)

          deplexo_auth = session(deplexo, identity_key, identity_public)
          if deplexo_auth["identity"] != railway_auth["identity"]:
              raise SystemExit("cross-backend identity mismatch")
          deplexo_payload = {
              **payload,
              "user_id": railway_auth["identity"],
              "stream": False,
          }
          response = httpx.post(
              deplexo + "/v1/chat",
              json=deplexo_payload,
              headers={
                  **deplexo_auth,
                  "Content-Type": "application/json",
                  "X-C33-Replay-Only": "false",
                  "X-C33-Recovery": "sse-request-id",
              },
              timeout=20,
          )
          if response.status_code != 200:
              raise SystemExit(f"Deplexo recovery failed: {response.status_code} {response.text}")
          data = response.json()
          if data.get("request_id") != request_id:
              raise SystemExit(f"Deplexo recovery request_id mismatch: {data.get('request_id')!r} != {request_id!r}")
          if not str(data.get("synthesis", "")).strip():
              raise SystemExit("Deplexo recovery returned empty synthesis")

          print("DEPLEXO_RECOVERY: PASS", request_id)
          print(json.dumps({
              "request_id": request_id,
              "recovery_backend": "Deplexo",
              "railway_replay_status": replay_status,
              "replayed": bool(data.get("_meta", {}).get("replayed")),
          }))
          PY

  deplexo:
    name: Deplexo runtime connectivity
    needs: [backend, mobile, release_install]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install httpx
      - name: Verify Deplexo runtime
        run: |
          python - <<'PY'
          import json
          import httpx

          endpoints = json.load(open("infra/c33-endpoints.json", encoding="utf-8"))
          base = str(endpoints["runtime_backup"]).rstrip("/")

          def get(path, timeout=12):
              response = httpx.get(base + path, timeout=timeout, headers={"Cache-Control": "no-cache"})
              if response.status_code != 200:
                  raise SystemExit(f"deplexo {path} failed: {response.status_code} {response.text}")
              return response.json()

          health = get("/health")
          if health.get("service") != "C-33":
              raise SystemExit(f"unexpected Deplexo health service: {json.dumps(health)}")
          if health.get("role") == "secondary":
              raise SystemExit(f"Deplexo cannot be a replication-only secondary for client failover: {json.dumps(health)}")

          ready = get("/ready")
          if ready.get("status") != "ready":
              raise SystemExit(f"Deplexo is not ready: {json.dumps(ready)}")
          if ready.get("peer_configured") is not True:
              raise SystemExit(f"Deplexo peer replication is not configured: {json.dumps(ready)}")
          if int(ready.get("provider_count", 0)) < 2:
              raise SystemExit(f"Deplexo provider redundancy is incomplete: {json.dumps(ready)}")

          ai_ready = get("/v1/ai-ready")
          if ai_ready.get("status") != "ai_ready" or not str(ai_ready.get("provider_used", "")).strip():
              raise SystemExit(f"Deplexo remote AI is not ready: {json.dumps(ai_ready)}")

          diagnostics = get("/v1/ai/diagnostics")
          if diagnostics.get("status") != "ok":
              raise SystemExit(f"Deplexo diagnostics are not green: {json.dumps(diagnostics)}")
          if int(diagnostics.get("providers_selectable", 0)) < 2:
              raise SystemExit(f"Deplexo provider selection redundancy is incomplete: {json.dumps(diagnostics)}")

          print(json.dumps({
              "deplexo": base,
              "health": health,
              "ready": ready,
              "ai_ready": ai_ready,
              "diagnostics": diagnostics,
          }, ensure_ascii=False, indent=2))
          print("C33_DEPLEXO_RUNTIME_GREEN")
          PY

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v3
        with:
          languages: python,javascript-typescript
      - uses: github/codeql-action/analyze@v3

  final:
    name: C-33 final matrix gate
    needs: [backend, mobile, android, release_install, live, deplexo, sse_replay_recovery, codeql, closure, closure_61_100, six_runtime_surfaces]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every certification gate to pass
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          MOBILE_RESULT: ${{ needs.mobile.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
          RELEASE_INSTALL_RESULT: ${{ needs.release_install.result }}
          LIVE_RESULT: ${{ needs.live.result }}
          DEPLEXO_RESULT: ${{ needs.deplexo.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          CLOSURE_RESULT: ${{ needs.closure.result }}
          CLOSURE_61_100_RESULT: ${{ needs.closure_61_100.result }}
          SIX_RUNTIME_RESULT: ${{ needs.six_runtime_surfaces.result }}
        run: |
          test "$BACKEND_RESULT" = success
          test "$MOBILE_RESULT" = success
          test "$ANDROID_RESULT" = success
          test "$RELEASE_INSTALL_RESULT" = success
          test "$LIVE_RESULT" = success
          test "$DEPLEXO_RESULT" = success
          test "$CODEQL_RESULT" = success
          test "$CLOSURE_RESULT" = success
          test "$CLOSURE_61_100_RESULT" = success
          test "$SIX_RUNTIME_RESULT" = success
          echo "C-33 FINAL MATRIX GREEN"
          echo "NEXO 41-60 CLOSURE GREEN"
          echo "NEXO 61-100 CONTRACT MATRIX GREEN"
          echo "NEXO 61-100 RUNTIME CLAIMS REQUIRE FRESH EVIDENCE"