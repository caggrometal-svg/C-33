name: C-33 Certification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: c33-certification-main
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  backend:
    name: Backend unit/resilience
    runs-on: ubuntu-latest