name: C-33 Certification

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: c33-certification-main
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  backend:
    name: Backend unit/resilience
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q src tests
      - run: python -m unittest discover -s tests -p "test_*.py" -v

  mobile:
    name: Mobile web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - working-directory: mobile
        run: npm install --no-audit --no-fund
      - working-directory: mobile
        run: npm run build


  android:
    name: Android packaging/lint gate
    needs: [mobile]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - working-directory: mobile
        run: npm install --no-audit --no-fund
      - working-directory: mobile
        run: npm run build
      - working-directory: mobile
        run: npx cap add android
      - working-directory: mobile
        run: npx cap sync android
      - working-directory: mobile/android
        run: ./gradlew lint

      - name: Set NEXO 0.1.6 version
        working-directory: mobile/android
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path("app/build.gradle")
          s = p.read_text()
          s = re.sub(r"versionCode\s+\d+", "versionCode 6", s, count=1)
          s = re.sub(r'versionName\s+"[^"]+"', 'versionName "0.1.6"', s, count=1)
          p.write_text(s)
          PY

      - name: Assemble NEXO 0.1.6 APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug

      - name: Verify NEXO 0.1.6 APK
        run: |
          test -f mobile/android/app/build/outputs/apk/debug/app-debug.apk
          echo "NEXO 0.1.6 APK ready:"
          ls -lh mobile/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload NEXO 0.1.6 APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXO-0.1.6-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  closure:
    name: NEXO closure 41-60
    needs: [backend]
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Verify closure matrix 41-60
        run: |
          python -m unittest tests.test_phases_41_60 -v
          python - <<'PY'
          import sys
          sys.path.insert(0, "src")
          from nexo.phases_41_60 import Closure41To60
          assert Closure41To60.validate()
          assert Closure41To60.green_sections() == tuple(range(41, 61))
          assert all(row["status"] != "RED" for row in Closure41To60.status_matrix())
          print("NEXO 41-60 CLOSURE GREEN")
          print("GREEN SECTIONS:", ",".join(map(str, Closure41To60.green_sections())))
          print("BLUE CAPABILITIES:", ",".join(Closure41To60.blue_capabilities()))
          PY

  closure_61_100:
    name: NEXO closure 61-100
    needs: [backend]
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Verify closure matrix 61-100
        run: |
          python -m unittest tests.test_phases_61_100 -v
          python - <<'PY'
          import sys
          sys.path.insert(0, "src")
          from nexo.phases_61_100 import Nexo61To100
          assert Nexo61To100.validate()
          assert Nexo61To100.green_sections() == tuple(range(61, 101))
          assert not Nexo61To100.has_red()
          print("NEXO 61-100 CLOSURE GREEN")
          print("GREEN SECTIONS:", ",".join(map(str, Nexo61To100.green_sections())))
          print("BLUE CAPABILITIES:", ",".join(Nexo61To100.blue_capabilities()))
          PY


  six_runtime_surfaces:
    name: NEXO six capability runtime surfaces
    needs: [backend, mobile]
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Verify local LLM and action execution boundaries
        run: |
          python -m unittest tests.test_local_llm tests.test_actions tests.test_six_capabilities -v
          python - <<'PY'
          from pathlib import Path
          api = Path("src/api.py").read_text(encoding="utf-8")
          mobile = Path("mobile/app.js").read_text(encoding="utf-8")
          for endpoint in ("/v1/local-ai", "/v1/replication/status", "/v1/export", "/v1/import", "/v1/actions/execute"):
              assert endpoint in api, endpoint
          for marker in ("exportNexoData", "importNexoData", "/v1/export", "/v1/import"):
              assert marker in mobile, marker
          operational = "\n".join(
              Path(path).read_text(encoding="utf-8")
              for path in ("src/config.py", "src/core/config.py", "src/resilience/providers.py", ".env.example")
          ).lower()
          for forbidden in ("blockrun.ai", "openai.com"):
              assert forbidden not in operational, "paid provider remains: " + forbidden
          assert "kilo-auto/free" in operational
          assert "vireonix.ai" in operational
          config_text = Path("src/config.py").read_text(encoding="utf-8")
          assert "AI_ZERO_COST_MODE" in config_text
          assert "paid_inference_keys_are_disabled_in_free_mode" in config_text
          print("NEXO SIX RUNTIME SURFACES GREEN")
          print("NEXO FREE-ONLY POLICY GREEN")
          PY

  live:
    name: Railway live connectivity
    needs: [backend, mobile]
    runs-on: ubuntu-latest
    env:
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install httpx
      - name: Live certification
        run: |
          python - <<'PY'
          import json, os, time, uuid
          import httpx

          def post_json(path, payload, *, timeout=22, attempts=8, retry_window=90):
              transient_statuses = {429, 500, 502, 503, 504}
              retry_deadline = time.time() + retry_window
              last_response = None
              last_error = None

              def server_retry_delay(response):
                  try:
                      data = response.json()
                      detail = data.get("detail", {})
                      if not isinstance(detail, dict):
                          return 0.0
                      delays = []
                      retry_after_ms = detail.get("retry_after_ms")
                      if retry_after_ms is not None:
                          delays.append(float(retry_after_ms) / 1000.0)
                      for attempt_data in detail.get("attempts", []):
                          if isinstance(attempt_data, dict) and attempt_data.get("cooldown_ms") is not None:
                              delays.append(float(attempt_data["cooldown_ms"]) / 1000.0)
                      return max(delays, default=0.0)
                  except (ValueError, TypeError, KeyError):
                      return 0.0

              for attempt in range(1, attempts + 1):
                  if time.time() >= retry_deadline:
                      break
                  try:
                      response = httpx.post(
                          base + path,
                          json=payload,
                          headers={
                              "X-C33-Allow-Local-Fallback": "false",
                              "X-C33-Deadline-Epoch-Ms": str(int((time.time() + 20) * 1000)),
                          },
                          timeout=timeout,
                      )
                      last_response = response
                      if response.status_code not in transient_statuses:
                          return response
                  except httpx.RequestError as exc:
                      last_error = exc

                  if attempt >= attempts:
                      break
                  exponential_delay = min(8.0, 2 ** (attempt - 1))
                  server_delay = server_retry_delay(last_response) if last_response is not None else 0.0
                  delay = max(1.0, exponential_delay, server_delay + 0.5)
                  delay = min(delay, max(0.0, retry_deadline - time.time()))
                  if delay <= 0:
                      break
                  time.sleep(delay)

              if last_response is not None:
                  return last_response
              raise SystemExit(f"remote request failed after {attempts} attempts/{retry_window}s: {last_error}")

          endpoints = json.loads(open("infra/c33-endpoints.json", encoding="utf-8").read())
          base = str(endpoints.get("production", "")).strip().rstrip("/")
          peer_base = str(endpoints.get("peer", "")).strip().rstrip("/")
          expected = os.environ["EXPECTED_SHA"]
          if not base or not peer_base:
              raise SystemExit("C33 live endpoint manifest is incomplete")
          deadline = time.time() + 180
          health_data = None

          while time.time() < deadline:
              try:
                  r = httpx.get(base + "/health", timeout=8, headers={"Cache-Control":"no-cache"})
                  if r.status_code == 200:
                      data = r.json()
                      if data.get("deployment_sha") == expected:
                          health_data = data
                          break
              except Exception:
                  pass
              time.sleep(5)

          if not health_data:
              raise SystemExit("Railway did not expose the expected certified SHA within 180s")

          ready = httpx.get(base + "/ready", timeout=10)
          if ready.status_code != 200:
              raise SystemExit(f"/ready failed: {ready.status_code} {ready.text}")

          payload = {
              "message": "Reply with exactly C33_REMOTE_SMOKE_OK.",
              "user_id": "github-certification",
              "conversation_id": "cert-" + uuid.uuid4().hex,
              "request_id": uuid.uuid4().hex,
              "stream": False,
          }
          chat = post_json("/v1/chat", payload)
          if chat.status_code != 200:
              raise SystemExit(f"remote chat failed: {chat.status_code} {chat.text}")
          chat_data = chat.json()
          meta = chat_data.get("_meta", {})
          if meta.get("used_local_fallback"):
              raise SystemExit("remote chat unexpectedly used local fallback")
          if not str(chat_data.get("synthesis", "")).strip():
              raise SystemExit("remote chat returned empty synthesis")

          web_payload = {
              "message": "Usa Internet: consulta una fuente externa sobre Artemis II y responde mencionando la URL de una fuente consultada.",
              "user_id": "github-web-certification",
              "conversation_id": "web-cert-" + uuid.uuid4().hex,
              "request_id": uuid.uuid4().hex,
              "stream": False,
          }
          web_chat = post_json("/v1/chat", web_payload)
          if web_chat.status_code != 200:
              raise SystemExit(f"web-enabled chat failed: {web_chat.status_code} {web_chat.text}")
          web_data = web_chat.json()
          web_meta = web_data.get("_meta", {})
          web_sources = web_data.get("web_searches", [])
          if web_meta.get("used_local_fallback"):
              raise SystemExit("web-enabled chat unexpectedly used local fallback")
          if not str(web_data.get("synthesis", "")).strip():
              raise SystemExit("web-enabled chat returned empty synthesis")
          if not isinstance(web_sources, list) or not any(str(source).startswith(("http://", "https://")) for source in web_sources):
              raise SystemExit(f"web navigation produced no external sources: {json.dumps(web_data)}")
          
          ai = httpx.get(base + "/v1/ai-ready", timeout=8)
          if ai.status_code != 200:
              raise SystemExit(f"/v1/ai-ready after remote generation failed: {ai.status_code} {ai.text}")
          probe = ai.json()
          if probe.get("status") != "ai_ready" or not str(probe.get("provider_used", "")).strip():
              raise SystemExit(f"Invalid live AI readiness probe: {json.dumps(probe)}")

          second_payload = {
              "message": "Using the conversation context, reply briefly with C33_MEMORY_OK.",
              "user_id": "github-certification",
              "conversation_id": payload["conversation_id"],
              "request_id": uuid.uuid4().hex,
              "stream": False,
          }
          second = post_json("/v1/chat", second_payload)
          if second.status_code != 200:
              raise SystemExit(f"second remote chat failed: {second.status_code} {second.text}")
          second_data = second.json()
          second_meta = second_data.get("_meta", {})

          export_request = {
              "user_id": payload["user_id"],
              "conversation_id": payload["conversation_id"],
              "identity_id": payload["user_id"],
              "device_id": "github-export-device",
              "preferences": {"font_size": "medium", "voice_tone": "neutral"},
              "configuration": {"backend_urls": [base]},
          }
          exported = httpx.post(base + "/v1/export", json=export_request, timeout=12)
          if exported.status_code != 200:
              raise SystemExit(f"export failed: {exported.status_code} {exported.text}")
          export_data = exported.json()
          bundle = export_data.get("bundle", {})
          if not bundle.get("sha256") or bundle.get("user_id") != payload["user_id"]:
              raise SystemExit(f"invalid export bundle: {json.dumps(export_data)}")

          imported_user = "github-import-" + uuid.uuid4().hex[:12]
          imported_conversation = "import-" + uuid.uuid4().hex
          conversation_map = {}
          migrated_messages = []
          for message in bundle.get("messages", []):
              copy = dict(message)
              source_conversation = str(copy.get("conversation_id") or "default")
              target_conversation = conversation_map.setdefault(
                  source_conversation,
                  imported_conversation + "-" + uuid.uuid5(uuid.NAMESPACE_URL, source_conversation).hex[:12],
              )
              copy["id"] = str(uuid.uuid4())
              copy["user_id"] = imported_user
              copy["conversation_id"] = target_conversation
              migrated_messages.append(copy)
          migrated_bundle = dict(bundle)
          migrated_bundle["user_id"] = imported_user
          migrated_bundle["identity_id"] = imported_user
          migrated_bundle["device_id"] = "github-import-device"
          migrated_bundle["messages"] = migrated_messages
          payload_for_digest = dict(migrated_bundle)
          payload_for_digest.pop("sha256", None)
          raw_digest = json.dumps(
              payload_for_digest, ensure_ascii=False, sort_keys=True, separators=(",", ":")
          ).encode("utf-8")
          import hashlib
          migrated_bundle["sha256"] = hashlib.sha256(raw_digest).hexdigest()

          imported = httpx.post(base + "/v1/import", json={"bundle": migrated_bundle, "replicate": False}, timeout=12)
          if imported.status_code != 200:
              raise SystemExit(f"import failed: {imported.status_code} {imported.text}")
          import_data = imported.json()
          if int(import_data.get("accepted", 0)) != len(migrated_messages):
              raise SystemExit(f"import did not accept full bundle: {json.dumps(import_data)}")

          local_ai = httpx.get(base + "/v1/local-ai", timeout=8)
          if local_ai.status_code != 200:
              raise SystemExit(f"local AI status surface failed: {local_ai.status_code} {local_ai.text}")
          local_ai_data = local_ai.json()
          if local_ai_data.get("status") != "ok" or local_ai_data.get("provider") != "local":
              raise SystemExit(f"invalid local AI status surface: {json.dumps(local_ai_data)}")

          action_gate = httpx.post(
              base + "/v1/actions/execute",
              json={
                  "user_id": payload["user_id"],
                  "action": "certification.denied",
                  "url": "https://example.com",
                  "authorized": False,
              },
              timeout=8,
          )
          if action_gate.status_code != 401:
              raise SystemExit(f"action authorization gate failed: {action_gate.status_code} {action_gate.text}")

          if second_meta.get("used_local_fallback"):
              raise SystemExit("second remote chat unexpectedly used local fallback")
          if not str(second_data.get("synthesis", "")).strip():
              raise SystemExit("second remote chat returned empty synthesis")

          saw_token = False
          saw_done = False
          saw_fallback = False
          with httpx.stream(
              "POST",
              base + "/v1/ai/stream",
              json={
                  "message": "Reply briefly with C33_SSE_OK.",
                  "user_id": "github-certification",
                  "conversation_id": "sse-" + uuid.uuid4().hex,
                  "request_id": uuid.uuid4().hex,
                  "stream": True,
              },
              headers={
                  "Accept": "text/event-stream",
                  "X-C33-Allow-Local-Fallback": "false",
                  "X-C33-Deadline-Epoch-Ms": str(int((time.time() + 20) * 1000)),
              },
              timeout=22,
          ) as stream:
              if stream.status_code != 200:
                  raise SystemExit(f"SSE failed: {stream.status_code} {stream.read().decode(errors='replace')}")
              for line in stream.iter_lines():
                  if line.startswith("event: token"):
                      saw_token = True
                  elif line.startswith("event: done"):
                      saw_done = True
                  elif line.startswith("event: fallback"):
                      saw_fallback = True

          if not saw_token or not saw_done:
              raise SystemExit(f"SSE incomplete: token={saw_token} done={saw_done}")
          if saw_fallback:
              raise SystemExit("SSE used local fallback")

          status = httpx.get(base + "/status", timeout=8)
          if status.status_code != 200:
              raise SystemExit(f"/status failed: {status.status_code} {status.text}")

          base_host = httpx.URL(base).host
          peer_host = httpx.URL(peer_base).host
          if not base_host or not peer_host or base_host == peer_host:
              raise SystemExit(f"invalid replication topology: production={base_host!r} peer={peer_host!r}")
          peer_health = httpx.get(peer_base + "/health", timeout=8)
          if peer_health.status_code != 200:
              raise SystemExit(f"peer health failed: {peer_health.status_code} {peer_health.text}")
          peer_health_data = peer_health.json()
          if peer_health_data.get("status") != "alive" or peer_health_data.get("role") != "secondary":
              raise SystemExit(f"peer is not a live secondary: {json.dumps(peer_health_data)}")

          replication = httpx.get(base + "/v1/replication/status", timeout=8)
          if replication.status_code != 200:
              raise SystemExit(f"/v1/replication/status failed: {replication.status_code} {replication.text}")
          replication_data = replication.json()
          if int(replication_data.get("replication_pending", -1)) != 0:
              raise SystemExit(f"replication is not quiesced: {json.dumps(replication_data)}")
          if replication_data.get("peer_status") != "ONLINE":
              raise SystemExit(f"real replication peer is not online: {json.dumps(replication_data)}")
          if replication_data.get("peer_host") != peer_host:
              raise SystemExit(
                  f"primary reports unexpected peer host: {replication_data.get('peer_host')!r} != {peer_host!r}"
              )
          if replication_data.get("quiesced") is not True:
              raise SystemExit(f"replication quiescence proof failed: {json.dumps(replication_data)}")
          peer_replication = httpx.get(peer_base + "/v1/replication/status", timeout=8)
          if peer_replication.status_code != 200:
              raise SystemExit(f"peer replication status failed: {peer_replication.status_code} {peer_replication.text}")
          peer_data = peer_replication.json()
          for key in ("total_messages", "unique_message_ids", "message_id_digest"):
              if peer_data.get(key) != replication_data.get(key):
                  raise SystemExit(
                      f"replication integrity mismatch for {key}: "
                      f"primary={replication_data.get(key)!r} peer={peer_data.get(key)!r}"
                  )
          if peer_data.get("backend_role") != "secondary":
              raise SystemExit(f"peer role mismatch: {json.dumps(peer_data)}")
          if int(peer_data.get("replication_pending", -1)) != 0:
              raise SystemExit(f"peer has pending replication work: {json.dumps(peer_data)}")

          diagnostics = httpx.get(base + "/v1/ai/diagnostics", timeout=8)
          if diagnostics.status_code != 200:
              raise SystemExit(f"/v1/ai/diagnostics failed: {diagnostics.status_code} {diagnostics.text}")
          diagnostics_data = diagnostics.json()
          if diagnostics_data.get("status") != "ok":
              raise SystemExit(f"invalid diagnostics status: {json.dumps(diagnostics_data)}")
          if int(diagnostics_data.get("providers_configured", 0)) < 2:
              raise SystemExit(f"provider redundancy missing: {json.dumps(diagnostics_data)}")
          if int(diagnostics_data.get("providers_ordered", 0)) != int(diagnostics_data.get("providers_configured", 0)):
              raise SystemExit(f"provider order incomplete: {json.dumps(diagnostics_data)}")
          if int(diagnostics_data.get("providers_selectable", 0)) < 2:
              raise SystemExit(f"provider selection incomplete: {json.dumps(diagnostics_data)}")
          if diagnostics_data.get("provider_configuration_valid") is not True:
              raise SystemExit(f"provider configuration invalid: {json.dumps(diagnostics_data)}")
          if diagnostics_data.get("local_fallback_enabled") is not True:
              raise SystemExit(f"local fallback must be enabled in production: {json.dumps(diagnostics_data)}")
          if len(set(diagnostics_data.get("provider_failure_domains", []))) < 2:
              raise SystemExit(f"provider failure domains not diverse: {json.dumps(diagnostics_data)}")

          print(json.dumps({
              "sha": expected,
              "health": health_data,
              "ready": ready.json(),
              "ai_ready": probe,
              "diagnostics": diagnostics_data,
              "chat_provider": meta.get("provider_used"),
              "second_chat_provider": second_meta.get("provider_used"),
              "chat_reason": meta.get("final_reason"),
              "sse": {"token": saw_token, "done": saw_done},
          }, ensure_ascii=False, indent=2))
          PY

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v3
        with:
          languages: python,javascript-typescript
      - uses: github/codeql-action/analyze@v3

  final:
    name: C-33 final matrix gate
    needs: [backend, mobile, android, live, codeql, closure, closure_61_100, six_runtime_surfaces]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every certification gate to pass
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          MOBILE_RESULT: ${{ needs.mobile.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
          LIVE_RESULT: ${{ needs.live.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          CLOSURE_RESULT: ${{ needs.closure.result }}
          CLOSURE_61_100_RESULT: ${{ needs.closure_61_100.result }}
          SIX_RUNTIME_RESULT: ${{ needs.six_runtime_surfaces.result }}
        run: |
          test "$BACKEND_RESULT" = success
          test "$MOBILE_RESULT" = success
          test "$ANDROID_RESULT" = success
          test "$LIVE_RESULT" = success
          test "$CODEQL_RESULT" = success
          test "$CLOSURE_RESULT" = success
          test "$CLOSURE_61_100_RESULT" = success
          test "$SIX_RUNTIME_RESULT" = success
          echo "C-33 FINAL MATRIX GREEN"
          echo "NEXO 41-60 CLOSURE GREEN"
          echo "NEXO 61-100 CLOSURE GREEN"
