name: C-33 Railway source repair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/railway-source-repair.yml"

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PROJECT_ID: 42f53158-a7d9-4ace-b0a3-ca963bec980b
      ENVIRONMENT_ID: 10c7138e-affe-4313-b97e-b223c1d68ca1
      SERVICE_ID: 72e6e976-2f75-4eee-bd61-9836910fa564
    steps:
      - uses: actions/checkout@v5
      - name: Check token presence
        run: test -n "$RAILWAY_API_TOKEN"
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Connect canonical C-33 GitHub source
        run: |
          railway service source connect \
            --repo caggrometal-svg/C-33 \
            --branch main \
            --service "$SERVICE_ID" \
            --project "$PROJECT_ID" \
            --environment "$ENVIRONMENT_ID" \
            --yes
      - name: Redeploy canonical service
        run: |
          railway service redeploy \
            --service "$SERVICE_ID" \
            --project "$PROJECT_ID" \
            --environment "$ENVIRONMENT_ID"
      - name: Show source
        run: |
          railway service status \
            --service "$SERVICE_ID" \
            --project "$PROJECT_ID" \
            --environment "$ENVIRONMENT_ID" \
            --json
