name: C-33 AI Provider Live

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: c33-ai-provider-live-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ai-provider-live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install runtime
        run: python -m pip install -r requirements.txt

      - name: Deterministic failover contract
        run: |
          python - <<'PY'
          import asyncio
          import httpx
          import sys
          from types import SimpleNamespace

          sys.path.insert(0, "src")
          from resilience.providers import DeadlineBudget, ProviderCascade, ProviderSpec

          class FakeState:
              async def circuit_before_call(self, provider_id):
                  return SimpleNamespace(allowed=True, cooldown_ms=0)

              async def circuit_success(self, provider_id, **kwargs):
                  return None

              async def circuit_failure(self, provider_id, **kwargs):
                  return None

          class Transport(httpx.AsyncBaseTransport):
              async def handle_async_request(self, request):
                  if request.url.host == "primary.test":
                      await asyncio.sleep(2.5)
                      return httpx.Response(503, request=request, json={"error": "forced_timeout_failover_test"})
                  return httpx.Response(
                      200,
                      request=request,
                      json={
                          "choices": [
                              {
                                  "message": {
                                      "content": "C33_FAILOVER_OK"
                                  }
                              }
                          ]
                      },
                  )

          specs = [
              ProviderSpec("primary", "https://primary.test/v1", "free-primary", None, "domain-a", 5000),
              ProviderSpec("backup", "https://backup.test/v1", "free-backup", None, "domain-b", 5000),
              ProviderSpec("last-resort", "https://last.test/v1", "free-last", None, "domain-c", 5000),
          ]
          cascade = ProviderCascade(
              FakeState(),
              specs,
              ["primary", "backup", "last-resort"],
              transport=Transport(),
          )
          assert DeadlineBudget(15_000).provider_timeout_ms(9_000) == 9_000
          result = asyncio.run(
              cascade.complete(
                  [{"role": "user", "content": "Reply exactly C33_FAILOVER_OK"}],
                  DeadlineBudget(12_000),
                  preferred_provider="primary",
              )
          )
          assert result.text == "C33_FAILOVER_OK"
          assert result.meta.provider_used == "backup"
          assert result.meta.failover_triggered is True
          print({
              "status": "PASS",
              "test": "primary_failure_then_backup_success",
              "provider_used": result.meta.provider_used,
              "failover_triggered": result.meta.failover_triggered,
              "attempts": result.meta.attempts,
          })
          PY

      - name: Real zero-cost provider cascade
        run: |
          python - <<'PY'
          import asyncio
          import sys
          from types import SimpleNamespace

          sys.path.insert(0, "src")
          from resilience.providers import DeadlineBudget, ProviderCascade, ProviderSpec

          class FakeState:
              async def circuit_before_call(self, provider_id):
                  return SimpleNamespace(allowed=True, cooldown_ms=0)

              async def circuit_success(self, provider_id, **kwargs):
                  return None

              async def circuit_failure(self, provider_id, **kwargs):
                  return None

          specs = [
              ProviderSpec(
                  "kilo",
                  "https://api.kilo.ai/api/gateway",
                  "kilo-auto/free",
                  None,
                  "kilo.ai",
                  5000,
              ),
              ProviderSpec(
                  "vireonix",
                  "https://vireonix.ai/v1",
                  "auto",
                  None,
                  "vireonix.ai",
                  5000,
              ),
              ProviderSpec(
                  "pollinations",
                  "https://text.pollinations.ai",
                  "openai-fast",
                  None,
                  "pollinations.ai",
                  5000,
              ),
          ]
          cascade = ProviderCascade(
              FakeState(),
              specs,
              ["kilo", "vireonix", "pollinations"],
          )

          async def main():
              observed = []
              for index in range(2):
                  result = await cascade.complete(
                      [{"role": "user", "content": "Reply exactly C33_LIVE_AI_OK"}],
                      DeadlineBudget(15_000),
                  )
                  if not result.text.strip():
                      raise SystemExit("live provider returned empty text")
                  observed.append(
                      {
                          "iteration": index + 1,
                          "provider": result.meta.provider_used,
                          "model": result.meta.model,
                          "latency_ms": result.meta.latency_ms,
                          "failover": result.meta.failover_triggered,
                          "attempts": result.meta.attempts,
                          "final_reason": result.meta.final_reason,
                          "text_prefix": result.text[:80],
                      }
                  )
              print({
                  "status": "PASS",
                  "cost_model": "$0",
                  "runs": observed,
              })

          asyncio.run(main())
          PY

  production-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: ai-provider-live
    steps:
      - uses: actions/checkout@v5
      - name: Resolve active C-33 backend
        run: echo "C33_BASE_URL=$(python -c 'import json; print(json.load(open("infra/c33-endpoints.json"))["production"])')" >> "$GITHUB_ENV"
      - name: Verify Railway liveness
        run: |
          set -euo pipefail
          BASE="$C33_BASE_URL"
          body="$(curl --fail-with-body --silent --show-error --retry 12 --retry-delay 3 --retry-max-time 90 --retry-all-errors --max-time 15 "$BASE/health")"
          echo "$body"
          python - "$body" <<'PY'
          import json, sys
          data=json.loads(sys.argv[1])
          assert data.get("status") == "alive"
          assert data.get("service") == "C-33"
          print({"status":"PASS","test":"production_health"})
          PY

      - name: Verify Railway AI generation
        run: |
          set -euo pipefail
          BASE="$C33_BASE_URL"
          auth_json="$(python scripts/c33_ci_auth.py "$BASE" "github-ai-provider-${GITHUB_RUN_ID}")"
          authorization="$(python -c 'import json,sys; print(json.load(sys.stdin)["authorization"])' <<<"$auth_json")"
          identity_id="$(python -c 'import json,sys; print(json.load(sys.stdin)["identity_id"])' <<<"$auth_json")"
          payload="$(python - "$identity_id" <<'PY'
          import json, sys
          print(json.dumps({
              "message":"Reply exactly C33_PRODUCTION_AI_OK",
              "user_id":sys.argv[1],
              "conversation_id":"ci-production-ai",
              "request_id":"ci-production-ai-001",
              "stream":False,
              "personality":"base",
              "voice_tone":"neutral"
          }))
          PY
          )"

          response="$(curl --fail-with-body --silent --show-error --max-time 35             -H "Content-Type: application/json"             -H "Authorization: $authorization"             -H "X-C33-Deadline-Epoch-Ms: $(( $(date +%s%3N) + 30000 ))"             -d "$payload" "$BASE/v1/chat")"
          echo "$response"
          python - "$response" <<'PY'
          import json, sys
          data=json.loads(sys.argv[1])
          assert data.get("status") == "ok", data
          assert data.get("synthesis", "").strip(), data
          meta=data.get("_meta") or {}
          assert meta.get("used_local_fallback") is False, data
          provider=meta.get("provider_used")
          assert provider in {"kilo","vireonix","pollinations"}, data
          assert int(meta.get("provider_attempts", 0)) >= 1, data
          print({
              "status":"PASS",
              "test":"production_ai_generation",
              "provider_used":provider,
              "provider_attempts":meta.get("provider_attempts"),
              "failover_triggered":meta.get("failover_triggered"),
              "final_reason":meta.get("final_reason"),
              "latency_ms":meta.get("latency_ms"),
          })
          PY
