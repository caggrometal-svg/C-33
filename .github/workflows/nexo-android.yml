name: NEXO Android APK

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/nexo-android.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web assets
        run: npm run build

      - name: Verify bundled runtime config
        run: |
          test -s dist/config.js
          grep -q "iac33-backup-production.up.railway.app" dist/config.js
          grep -q "CONFIG_VERSION" dist/config.js

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set NEXO 0.1.6 version
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/build.gradle")
          s = p.read_text()
          s = re.sub(r"versionCode\s+\d+", "versionCode 6", s, count=1)
          s = re.sub(r'versionName\s+"[^"]+"', 'versionName "0.1.6"', s, count=1)
          p.write_text(s)
          PY

      - name: Build NEXO 0.1.6 debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Verify NEXO 0.1.6 version
        run: |
          grep -q 'versionCode 6' android/app/build.gradle
          grep -q 'versionName "0.1.6"' android/app/build.gradle

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXO-0.1.6-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14