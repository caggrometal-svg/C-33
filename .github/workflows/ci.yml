name: C-33 Certification

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Python compile
        run: python -m compileall src tests scripts
      - name: Resilience and fault-injection tests
        env:
          PYTHONPATH: src
          PORT: "8000"
          SECRET_KEYS: '["unit-test-secret-1234567890"]'
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Mobile syntax and bundle
        working-directory: mobile
        run: |
          npm install
          node --check app.js
          node --check config.js
          npm run build

  certification:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      RENDER_URL: https://c33-backend.onrender.com
      RAILWAY_URL: https://iac33-backup-production.up.railway.app
      EXPECTED_SHA: \${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Exact live certification
        env:
          PYTHONPATH: src
        run: python scripts/certify_matrix.py --render-url "$RENDER_URL" --railway-url "$RAILWAY_URL" --expected-sha "$EXPECTED_SHA"
      - name: Verify no provider-domain single point of failure
        env:
          PYTHONPATH: src
        run: python scripts/certify_matrix.py --render-url "$RENDER_URL" --railway-url "$RAILWAY_URL" --expected-sha "$EXPECTED_SHA" --provider-diversity-only

  android-gate:
    needs: certification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: mobile
        run: npm install && npm run build
      - working-directory: mobile
        run: npx cap add android && npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - working-directory: mobile/android
        run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: c33-debug-apk-certified
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
