name: C-33 Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install

      - name: Build Vite web bundle
        working-directory: mobile
        run: npm run build

      - name: Add Android platform
        working-directory: mobile
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: mobile
        run: npx cap sync android

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set NEXO 0.1.6 version
        working-directory: mobile/android
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path("app/build.gradle")
          s = p.read_text()
          s = re.sub(r"versionCode\s+\d+", "versionCode 6", s, count=1)
          s = re.sub(r'versionName\s+"[^"]+"', 'versionName "0.1.6"', s, count=1)
          p.write_text(s)
          PY

      - name: Build NEXO 0.1.6 debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify NEXO 0.1.6 version
        run: |
          grep -q 'versionCode 6' mobile/android/app/build.gradle
          grep -q 'versionName "0.1.6"' mobile/android/app/build.gradle

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXO-0.1.6-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
