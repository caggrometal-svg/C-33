name: NEXO Android APK
# C-33 0.1.6 production APK build gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build NEXO 0.1.6 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - working-directory: mobile
        run: npm install --no-audit --no-fund

      - working-directory: mobile
        run: npm run build

      - working-directory: mobile
        run: npx cap add android

      - working-directory: mobile
        run: npx cap sync android

      - working-directory: mobile/android
        run: ./gradlew assembleDebug

      - name: Verify APK
        run: |
          test -f mobile/android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh mobile/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXO-0.1.6-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
