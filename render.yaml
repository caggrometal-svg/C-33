services:
  - type: web
    name: c33-backend
    env: docker
    plan: free
    region: oregon
    buildCommand: docker build -t c33-backend .
    startCommand: uvicorn src.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: MODEL_BASE_URL
        value: https://vireonix.ai/v1
      - key: MODEL_NAME
        value: auto
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEYS
        sync: false
      - key: PORT
        value: 10000
