services:
  - type: web
    name: c33-backend
    env: docker
    plan: free
    region: oregon
    buildCommand: docker build -t c33-backend .
    startCommand: uvicorn src.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: C33_ROLE
        value: secondary
      - key: PUBLIC_BASE_URL
        value: https://c33-backend.onrender.com
      - key: CLIENT_TIMEOUT_MS
        value: "15000"
      - key: BACKEND_TOTAL_TIMEOUT_MS
        value: "12000"
      - key: NETWORK_TIMEOUT_SECONDS
        value: "8"
      - key: LOCAL_FALLBACK_ENABLED
        value: "true"
      - key: REQUIRE_PROVIDER_REDUNDANCY
        value: "true"
      - key: PEER_BACKEND_URL
        value: https://iac33-backup-production.up.railway.app
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEYS
        sync: false
      - key: PEER_REPLICATION_SECRET
        sync: false
      - key: AI_PROVIDERS_JSON
        sync: false
      - key: AI_PROVIDER_ORDER
        sync: false
      - key: PORT
        value: "10000"
