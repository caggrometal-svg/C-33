services:
  - type: web
    name: c33-backend
    env: docker
    plan: free
    region: oregon
    buildCommand: docker build -t c33-backend .
    startCommand: uvicorn src.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: C33_ROLE
        value: secondary
      - key: PUBLIC_BASE_URL
        value: https://c33-backend.onrender.com
      - key: CLIENT_TIMEOUT_MS
        value: "22000"
      - key: BACKEND_TOTAL_TIMEOUT_MS
        value: "18000"
      - key: NETWORK_TIMEOUT_SECONDS
        value: "8"
      - key: LOCAL_FALLBACK_ENABLED
        value: "true"
      - key: REQUIRE_PROVIDER_REDUNDANCY
        value: "true"
      - key: PEER_BACKEND_URL
        value: https://iac33-backup-production.up.railway.app
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEYS
        sync: false
      - key: PEER_REPLICATION_SECRET
        sync: false
      - key: AI_PROVIDERS_JSON
        value: '[{"id":"kilo","base_url":"https://api.kilo.ai/api/gateway","model":"kilo-auto/free","failure_domain":"kilo.ai","timeout_ms":5500},{"id":"animica","base_url":"https://animica.dev/v1","model":"animica-chat-small","failure_domain":"animica.dev","timeout_ms":5750},{"id":"vireonix","base_url":"https://vireonix.ai/v1","model":"auto","failure_domain":"vireonix.ai","timeout_ms":6000},{"id":"blockrun","base_url":"https://blockrun.ai/api/v1","model":"nvidia/gpt-oss-20b","failure_domain":"blockrun.ai","timeout_ms":4000}]'
      - key: AI_PROVIDER_ORDER
        value: "kilo,animica,vireonix,blockrun"
      - key: PORT
        value: "10000"
